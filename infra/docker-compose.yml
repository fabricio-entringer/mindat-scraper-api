version: '3.8'

services:
  mindat-scraper-api:
    build: 
      context: ..
      dockerfile: infra/Dockerfile
    container_name: mindat-scraper-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SCRAPER_HEADLESS=true
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/minerals.json
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

